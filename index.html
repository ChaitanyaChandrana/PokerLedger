// ---------- Firestore backend ----------
const db = firebase.firestore();
function gamesCol() {
  return db.collection("poker_games");
}
async function fsCreateGame(code, gameObj) {
  try {
    await gamesCol().doc(code).set(gameObj);
    return {
      ok: true
    };
  } catch (e) {
    return {
      ok: false,
      message: "Couldn't create the game — check your connection and try again."
    };
  }
}
async function fsGetGame(code) {
  try {
    const snap = await gamesCol().doc(code).get();
    return {
      ok: true,
      value: snap.exists ? snap.data() : null
    };
  } catch (e) {
    return {
      ok: false,
      message: "Couldn't reach the game — check your connection and try again."
    };
  }
}
async function fsSetGame(code, gameObj) {
  try {
    await gamesCol().doc(code).set(gameObj);
    return {
      ok: true
    };
  } catch (e) {
    return {
      ok: false,
      message: "That didn't save — check your connection and try again."
    };
  }
}
function genCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no 0/O/1/I/L ambiguity
  let s = "";
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

// ---------- local per-device identity + leaderboard history ----------
const ROLE_KEY = "pokerRole";
const HISTORY_KEY = "pokiriKurrolluHistory";
function loadRole() {
  try {
    const raw = localStorage.getItem(ROLE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
function saveRole(role) {
  try {
    localStorage.setItem(ROLE_KEY, JSON.stringify(role));
  } catch {}
}
function clearRole() {
  try {
    localStorage.removeItem(ROLE_KEY);
  } catch {}
}
function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch {
    return null;
