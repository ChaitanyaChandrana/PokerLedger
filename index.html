<body>
<div id="root"></div>
<script>
const {
  useState,
  useRef,
  useMemo,
  useEffect
} = React;
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const money = n => n < 0 ? "-$" + Math.abs(n).toFixed(2) : "$" + n.toFixed(2);
const HISTORY_KEY = "pokiriKurrolluHistory";
const SESSION_KEY = "pokerAppSession";
function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch {
    return null;
  }
}
function saveHistory(history) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    return true;
  } catch {
    return false;
  }
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
function saveSession(session) {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  } catch {}
}
function parseBulkNames(text) {
  return text.split("\n").map(line => line.trim()).filter(Boolean).map(line => {
    const parts = line.split(",");
    const name = parts[0].trim();
    const phone = parts.length > 1 ? parts.slice(1).join(",").trim() : "";
    return {
      name,
      phone
    };
  }).filter(p => p.name.length > 0);
}
function buildSummaryText(game, nets, transactions) {
  const lines = [];
  lines.push(`${game.name} — Settlement`);
  lines.push(new Date().toLocaleString());
  lines.push("");
  lines.push("Results:");
  game.players.forEach(p => {
    const net = nets[p.id];
    lines.push(`  ${p.name}: ${net >= 0 ? "+" : ""}${money(net)}`);
  });
  lines.push("");
  if (transactions.length === 0) {
    lines.push("Everyone's even — no payments needed.");
  } else {
    lines.push("Who pays who:");
    transactions.forEach(t => {
      const from = game.players.find(p => p.id === t.from);
      const to = game.players.find(p => p.id === t.to);
      const toPhone = to.phone ? ` (${to.phone})` : "";
      lines.push(`  ${from.name} pays ${to.name}${toPhone}: ${money(t.amount)}`);
    });
  }
  return lines.join("\n");
}
function settleDebts(nets) {
