<div id="root"></div>
<script>
const {
  useState,
  useEffect,
  useRef,
  useCallback,
  useMemo
} = React;
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const money = n => n < 0 ? "-$" + Math.abs(n).toFixed(2) : "$" + n.toFixed(2);

// ---------- kvdb.io sync backend (no signup needed) ----------
async function kvdbCreateBucket() {
  try {
    const res = await fetch("https://kvdb.io/", {
      method: "POST"
    });
    if (!res.ok) return {
      ok: false,
      message: `Couldn't reach the sync service (HTTP ${res.status}).`
    };
    const id = (await res.text()).trim();
    if (!id || id.length > 64 || /\s/.test(id)) return {
      ok: false,
      message: "Sync service returned an unexpected response."
    };
    return {
      ok: true,
      bucket: id
    };
  } catch (e) {
    return {
      ok: false,
      message: "Couldn't reach the sync service — check your internet connection."
    };
  }
}
async function kvdbGet(bucket, key) {
  try {
    const res = await fetch(`https://kvdb.io/${bucket}/${key}`);
    if (res.status === 404) return {
      ok: true,
      value: null
    };
    if (!res.ok) return {
      ok: false,
      message: `Sync read failed (HTTP ${res.status}).`
    };
    const text = await res.text();
    return {
      ok: true,
      value: text ? JSON.parse(text) : null
    };
  } catch (e) {
    return {
      ok: false,
      message: "Couldn't reach the sync service — check your internet connection."
    };
  }
}
async function kvdbPut(bucket, key, value) {
  try {
    const res = await fetch(`https://kvdb.io/${bucket}/${key}`, {
      method: "PUT",
      body: JSON.stringify(value)
    });
    if (!res.ok) return {
      ok: false,
      message: `Sync save failed (HTTP ${res.status}).`
    };
    return {
      ok: true
    };
  } catch (e) {
    return {
      ok: false,
      message: "Couldn't save — check your internet connection."
    };
  }
}

// ---------- local per-device identity + leaderboard history ----------
const ROLE_KEY = "pokerRole";
const HISTORY_KEY = "pokiriKurrolluHistory";
function loadRole() {
  try {
    const raw = localStorage.getItem(ROLE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
function saveRole(role) {
  try {
    localStorage.setItem(ROLE_KEY, JSON.stringify(role));
  } catch {}
}
function clearRole() {
  try {
    localStorage.removeItem(ROLE_KEY);
  } catch {}
}
function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch {
    return null;
  }
}
function saveHistory(history) {
  try {

      cents: -cents

      to: c.id,
      cents: amt
